apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: wordpress
  name: wordpress
spec:
  containers:
  - image: wordpress:6.4-apache
    name: wordpress
    ports:
    - containerPort: 80
      protocol: TCP
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
